{% extends "learning_logs/base.html" %}
{% load bootstrap4 %}
{% block title %}Вход · Учебный журнал{% endblock %}
{% block content %}
<section class="form-panel">
  <h1>Вход</h1>
  <form method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit">Войти</button>
  </form>
  <p class="mt-3 mb-0"><a href="{% url 'users:register' %}">Создать аккаунт</a></p>
</section>
{% endblock %}
