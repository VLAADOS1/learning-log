{% load bootstrap4 static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Учебный журнал{% endblock %}</title>
  {% bootstrap_css %}
  <link rel="stylesheet" href="{% static 'journal.css' %}">
</head>
<body>
  <header class="site-header">
    <nav class="container d-flex flex-wrap align-items-center justify-content-between" aria-label="Главное меню">
      <a class="brand" href="{% url 'learning_logs:index' %}">Учебный журнал</a>
      <div class="nav-links">
        {% if user.is_authenticated %}
          <a href="{% url 'learning_logs:topics' %}">Мои темы</a>
          <span class="username">{{ user.username }}</span>
          <form method="post" action="{% url 'users:logout' %}">
            {% csrf_token %}
            <button class="btn btn-sm btn-outline-secondary" type="submit">Выйти</button>
          </form>
        {% else %}
          <a href="{% url 'users:login' %}">Войти</a>
          <a class="btn btn-sm btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
      </div>
    </nav>
  </header>
  <main class="container page">{% block content %}{% endblock %}</main>
</body>
</html>
