{% extends "learning_logs/base.html" %}
{% block content %}
<section class="hero">
  <h1>Учебный журнал</h1>
  <p>Создавайте темы, записывайте то, что узнали, и возвращайтесь к своим заметкам.</p>
  {% if user.is_authenticated %}
    <a class="btn btn-primary" href="{% url 'learning_logs:topics' %}">Перейти к темам</a>
  {% else %}
    <a class="btn btn-primary" href="{% url 'users:register' %}">Создать аккаунт</a>
  {% endif %}
</section>
{% endblock %}
